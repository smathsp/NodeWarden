name: Sync upstream safely

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Select sync token
        id: auth
        env:
          CUSTOM_SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          DEFAULT_SYNC_TOKEN: ${{ github.token }}
        run: |
          token="$DEFAULT_SYNC_TOKEN"
          uses_custom_token=false
          if [ -n "$CUSTOM_SYNC_TOKEN" ]; then
            response="$RUNNER_TEMP/sync-token-repo.json"
            status=$(curl --silent --show-error --retry 2 \
              --connect-timeout 10 --max-time 30 \
              --output "$response" --write-out '%{http_code}' \
              --header "Authorization: Bearer $CUSTOM_SYNC_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY") || status=000
            if [ "$status" = "200" ] && jq -e '.permissions.push == true' "$response" > /dev/null; then
              token="$CUSTOM_SYNC_TOKEN"
              uses_custom_token=true
            else
              echo "::warning::UPSTREAM_SYNC_TOKEN is invalid or lacks repository write access (HTTP $status). Falling back to GITHUB_TOKEN."
            fi
          fi
          echo "SYNC_TOKEN=$token" >> "$GITHUB_ENV"
          echo "uses_custom_token=$uses_custom_token" >> "$GITHUB_OUTPUT"

      - name: Check out fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
          token: ${{ env.SYNC_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/shuaiplus/NodeWarden.git
          git fetch upstream main --tags

      - name: Check for upstream changes
        id: check
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
            echo "Fork already contains the latest upstream commit."
          else
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
            echo "Upstream changes detected."
          fi

      - name: Merge upstream without force
        id: merge
        if: steps.check.outputs.needs_update == 'true'
        continue-on-error: true
        run: |
          if git merge --no-edit upstream/main; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          conflict_files=$(git diff --name-only --diff-filter=U | paste -sd ', ' -)
          echo "conflict_files=$conflict_files" >> "$GITHUB_OUTPUT"
          git merge --abort
          exit 1

      - name: Push merged changes
        id: push
        if: steps.check.outputs.needs_update == 'true' && steps.merge.outputs.merged == 'true'
        env:
          USES_CUSTOM_TOKEN: ${{ steps.auth.outputs.uses_custom_token }}
        run: |
          if [ "$USES_CUSTOM_TOKEN" != "true" ] && \
            ! git diff --quiet origin/main HEAD -- .github/workflows; then
            echo "::error::Upstream changed workflow files. Configure a valid UPSTREAM_SYNC_TOKEN with repository Contents and Workflows write access (classic PAT: repo + workflow), then rerun."
            exit 1
          fi
          git push origin HEAD:main

      - name: Open conflict notification
        if: steps.merge.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          CONFLICT_FILES: ${{ steps.merge.outputs.conflict_files }}
        run: |
          title="Automated upstream sync conflict"
          existing=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "$title in:title" \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            gh issue comment "$existing" \
              --repo "$GITHUB_REPOSITORY" \
              --body "The scheduled upstream sync failed again on $(date -u +%F). Conflicting files: ${CONFLICT_FILES:-unknown}. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body "The scheduled merge from shuaiplus/NodeWarden failed on $(date -u +%F) and was safely aborted. No force push was performed. Conflicting files: ${CONFLICT_FILES:-unknown}. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      - name: Fail after conflict notification
        if: steps.merge.outcome == 'failure'
        run: exit 1

      - name: Write summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          NEEDS_UPDATE: ${{ steps.check.outputs.needs_update }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
        run: |
          if [ "$JOB_STATUS" != "success" ]; then
            echo "### Upstream sync failed" >> "$GITHUB_STEP_SUMMARY"
            echo "See the failed step above for details. The fork was not reported as up to date." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PUSH_OUTCOME" = "success" ]; then
            echo "### Upstream sync completed" >> "$GITHUB_STEP_SUMMARY"
            echo "Merged upstream commit \`$(git rev-parse upstream/main)\` without force." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$NEEDS_UPDATE" = "false" ]; then
            echo "### Already up to date" >> "$GITHUB_STEP_SUMMARY"
          fi
